<!doctype html><meta charset=utf-8><body style="margin:0;background:#040506;color:#e6e6e6;font:14px Inter,system-ui;padding:32px">
<div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center">
<script>for(const n of ['blaze','ember','forge','spark','ward'])document.write(`<div style="text-align:center"><img src="${n}.svg" width=120><div>${n}</div></div>`)</script>
<div style="text-align:center"><img src="favicon.svg" width=64><div>favicon</div></div></div>
<h4>small sizes</h4><div style="display:flex;gap:16px;align-items:center"><script>for(const s of [16,24,32,48])for(const n of ['blaze','ember','forge','spark','ward'])document.write(`<img src="${n}.svg" width=${s}>`)</script></div>
<h4>mono on light</h4><div style="background:#fff;color:#111;padding:16px;display:flex;gap:16px"><script>for(const n of ['blaze','ember','forge','spark','ward'])document.write(`<img src="${n}-mono.svg" width=56>`)</script></div>
</body>
