[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/blaze"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
prettyplease = "0.2"
toml = "0.8"
blaze-core = { path = "crates/blaze-core" }
blaze-ember = { path = "crates/ember" }
blaze-forge = { path = "crates/forge" }
blaze-spark = { path = "crates/spark" }
blaze-ward = { path = "crates/ward" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
