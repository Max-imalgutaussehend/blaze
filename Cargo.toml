[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/blaze"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit-mut"] }
prettyplease = "0.2"
toml = "0.8"
mimalloc = "0.1"
toml_edit = "0.22"
semver = "1"
flate2 = "1"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
blaze-cargo = { path = "crates/blaze-cargo" }
blaze-core = { path = "crates/blaze-core" }
blaze-lexer = { path = "crates/blaze-lexer" }
blaze-ember = { path = "crates/ember" }
blaze-forge = { path = "crates/forge" }
blaze-spark = { path = "crates/spark" }
blaze-ward = { path = "crates/ward" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
