[package]
name = "blaze"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blaze: extremely fast Rust tooling (ember, forge, spark, ward)"

[dependencies]
anyhow.workspace = true
blaze-cargo.workspace = true
blaze-core.workspace = true
blaze-ember.workspace = true
blaze-forge.workspace = true
blaze-spark.workspace = true
blaze-ward.workspace = true
clap.workspace = true
mimalloc.workspace = true
rayon.workspace = true

[[bin]]
name = "blaze"
path = "src/main.rs"
[[bin]]
name = "ember"
path = "src/bin/ember.rs"
[[bin]]
name = "forge"
path = "src/bin/forge.rs"
[[bin]]
name = "spark"
path = "src/bin/spark.rs"
[[bin]]
name = "ward"
path = "src/bin/ward.rs"
