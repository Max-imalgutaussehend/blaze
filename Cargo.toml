[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/blaze"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
toml = "0.8"
blaze-core = { path = "crates/blaze-core" }
blaze-lint = { path = "crates/blaze-lint" }
blaze-fmt = { path = "crates/blaze-fmt" }
blaze-test = { path = "crates/blaze-test" }
blaze-deny = { path = "crates/blaze-deny" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
